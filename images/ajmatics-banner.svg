<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Atharva Anand Joshi — AJMATICS</title>
  <desc id="desc">Neon gradient banner representing data engineering, artificial intelligence, cloud platforms and architecture.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070A20"/><stop offset=".52" stop-color="#11113A"/><stop offset="1" stop-color="#071B2C"/></linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00E5FF"/><stop offset=".48" stop-color="#9A63FF"/><stop offset="1" stop-color="#FF4FD8"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFD166"/><stop offset="1" stop-color="#FF8A5B"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#67D8FF" stroke-opacity=".09" stroke-width="1"/></pattern>
  </defs>
  <rect width="1200" height="340" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="28" fill="url(#grid)"/>
  <circle cx="1020" cy="-20" r="230" fill="#7C3AED" opacity=".12"/>
  <circle cx="115" cy="320" r="230" fill="#00C8FF" opacity=".10"/>
  <g fill="#E7F9FF" opacity=".78"><circle cx="73" cy="53" r="2"/><circle cx="160" cy="86" r="1.5"/><circle cx="255" cy="37" r="1.7"/><circle cx="1060" cy="58" r="2"/><circle cx="1126" cy="128" r="1.5"/><circle cx="1031" cy="270" r="2"/><circle cx="876" cy="40" r="1.3"/><circle cx="620" cy="28" r="1.2"/><circle cx="550" cy="305" r="1.4"/></g>
  <path d="M0 278 C180 212 260 336 430 274 S745 205 900 270 S1090 302 1200 230" fill="none" stroke="url(#neon)" stroke-width="2" opacity=".65"/>
  <path d="M0 294 C180 228 260 352 430 290 S745 221 900 286 S1090 318 1200 246" fill="none" stroke="#66E5FF" stroke-width="1" opacity=".25"/>
  <!-- AJ monogram -->
  <g transform="translate(62 76)" filter="url(#glow)">
    <path d="M62 0L112 100H88L76 75H37L25 100H2L52 0Z M47 55H66L57 32Z" fill="none" stroke="url(#neon)" stroke-width="7" stroke-linejoin="round"/>
    <path d="M116 3H174L153 100H130L146 25H116Z" fill="none" stroke="#B68CFF" stroke-width="7" stroke-linejoin="round"/>
  </g>
  <text x="65" y="216" fill="#A7F3FF" font-family="Segoe UI,Arial,sans-serif" font-size="20" letter-spacing="6">AJMATICS</text>
  <text x="65" y="244" fill="#95A9D8" font-family="Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="3">BUILD • AUTOMATE</text>
  <!-- Identity -->
  <text x="290" y="106" fill="#F8FAFF" font-family="Segoe UI,Arial,sans-serif" font-size="48" font-weight="700" letter-spacing="1">ATHARVA ANAND JOSHI</text>
  <rect x="292" y="126" width="690" height="3" rx="2" fill="url(#neon)"/>
  <text x="294" y="169" fill="#65E7FF" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="600" letter-spacing="2">DATA &amp; AI ENGINEERING PROFESSIONAL</text>
  <text x="294" y="207" fill="#C4CDEB" font-family="Segoe UI,Arial,sans-serif" font-size="18">Data Engineering  •  AI/ML  •  GenAI  •  Cloud  •  Data Platforms  •  Architecture</text>
  <!-- chips -->
  <g font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600">
    <rect x="294" y="232" width="152" height="36" rx="18" fill="#102B49" stroke="#00D9FF"/><text x="370" y="255" text-anchor="middle" fill="#BDF7FF">ENGINEER</text>
    <rect x="460" y="232" width="142" height="36" rx="18" fill="#211C4A" stroke="#9B79FF"/><text x="531" y="255" text-anchor="middle" fill="#E0D7FF">BUILDER</text>
    <rect x="616" y="232" width="190" height="36" rx="18" fill="#3B2145" stroke="#FF68D7"/><text x="711" y="255" text-anchor="middle" fill="#FFE0F7">PROBLEM SOLVER</text>
    <rect x="820" y="232" width="177" height="36" rx="18" fill="#183D43" stroke="#5CE6BC"/><text x="908" y="255" text-anchor="middle" fill="#D4FFF1">LIFELONG LEARNER</text>
  </g>
  <!-- data network -->
  <g stroke="url(#neon)" stroke-width="2.5" fill="#0B1431" filter="url(#glow)">
    <path d="M1026 93L1080 126L1133 91M1080 126L1080 190M1026 93L1026 202M1133 91L1133 202" fill="none" opacity=".7"/>
    <circle cx="1026" cy="93" r="11"/><circle cx="1080" cy="126" r="14"/><circle cx="1133" cy="91" r="11"/><circle cx="1026" cy="202" r="10"/><circle cx="1080" cy="190" r="10"/><circle cx="1133" cy="202" r="10"/>
  </g>
  <text x="1060" y="314" text-anchor="middle" fill="url(#gold)" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" letter-spacing="2">TURNING IDEAS INTO IMPACT</text>
  <rect x="1.5" y="1.5" width="1197" height="337" rx="27" fill="none" stroke="url(#neon)" stroke-opacity=".75" stroke-width="3"/>
</svg>
