name: Update GitHub activity chart

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/activity-chart.yml"
      - "README.md"
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-activity-chart
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v6

      - name: Generate contribution activity charts
        uses: dturovskiy/deus-commit-chart@v1.5.3
        with:
          source: github
          username: ${{ github.repository_owner }}
          token: ${{ secrets.GITHUB_TOKEN }}
          default-days: '365'
          ranges: '30,90,365'
          layout: spacious
          output-dir: activity-dist

      - name: Copy charts into the profile repository
        run: |
          mkdir -p profile
          cp activity-dist/activity-30d.svg profile/activity-30d.svg
          cp activity-dist/activity-90d.svg profile/activity-90d.svg
          cp activity-dist/activity-365d.svg profile/activity-365d.svg

      - name: Commit generated activity charts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/activity-30d.svg profile/activity-90d.svg profile/activity-365d.svg
          if git diff --cached --quiet; then
            echo "Activity charts are already up to date."
            exit 0
          fi
          git commit -m "chore: refresh GitHub activity charts"
          git push
